security:
  # Hachage mot de passe
  password_hashers:
    App\Entity\Utilisateur: 'auto'

  # Recherche utilisateur par email
  providers:
    users:
      entity:
        class: App\Entity\Utilisateur
        property: email

  firewalls:
    dev:
      pattern: ^/(_(profiler|wdt)|css|images|js)/
      security: false

    main:
      lazy: true
      provider: users

      form_login:
        # Formulaire connexion
        login_path: app_login
        check_path: app_login
        default_target_path: app_accueil
        always_use_default_target_path: true
        username_parameter: email
        password_parameter: password

      logout:
        # Déconnexion
        path: app_logout
        target: app_accueil

  access_control:
    # Seul un administrateur peut acceder au tableau de bord EasyAdmin.
    - { path: ^/admin, roles: ROLE_ADMIN }
    # Le paiement et le recapitulatif de commande sont reserves aux utilisateurs connectes.
    - { path: ^/panier/paiement, roles: ROLE_USER }
    - { path: ^/panier/success, roles: ROLE_USER }
    - { path: ^/commande/derniere, roles: ROLE_USER }
