services:
  php:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/var

    depends_on:
      db:
        condition: service_healthy

    networks:
      - connectPerso

  nginx:
    image: nginx:stable

    ports:
      - "8085:80"

    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/var
      - ./docker/nginx/default.conf/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

    networks:
      - connectPerso

  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Kasutamu_Pon
      MYSQL_USER: app
      MYSQL_PASSWORD: app

    ports:
      - "3310:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - connectPerso

    command: --innodb-buffer-pool-size=128M

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    ports:
      - "8082:80"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

    depends_on:
      - db

    networks:
      - connectPerso

networks:
  connectPerso:
    driver: bridge

volumes:
  mysql_data: