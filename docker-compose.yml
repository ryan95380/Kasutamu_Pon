services:
  # Application Symfony
  php:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - .:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/var

    command: >
      sh -c "mkdir -p var/cache var/log var/sessions
      && chown -R www-data:www-data var
      && php-fpm"

    environment:
      # Configuration Docker
      APP_ENV: prod
      APP_DEBUG: 0
      DOCTRINE_DEPRECATIONS: disabled
      SYMFONY_DEPRECATIONS_HELPER: disabled
      DATABASE_URL: "mysql://app:app@db:3306/Kasutamu_Pon?serverVersion=8.0&charset=utf8mb4"

    depends_on:
      db:
        condition: service_healthy

    networks:
      - connectPerso

  # Serveur web
  nginx:
    image: nginx:stable

    ports:
      - "8085:80"

    volumes:
      - .:/var/www/html:cached
      - ./docker/nginx/default.conf/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

    networks:
      - connectPerso

  # Base MySQL
  db:
    image: mysql:8.0

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Kasutamu_Pon
      MYSQL_USER: app
      MYSQL_PASSWORD: app

    ports:
      - "3310:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - connectPerso

    command: --innodb-buffer-pool-size=128M

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Administration BDD
  phpmyadmin:
    image: phpmyadmin/phpmyadmin

    ports:
      - "8082:80"

    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root

    depends_on:
      - db

    networks:
      - connectPerso

networks:
  connectPerso:
    driver: bridge

volumes:
  mysql_data:
